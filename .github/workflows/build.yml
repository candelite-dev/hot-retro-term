name: Build

on:
  pull_request:
  push:
    branches: [master, feature, windows-port]

jobs:
  build-ubuntu:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: [22.04, 24.04]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          modules: 'qt5compat qtshadertools'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libxcb1-dev \
            libfontconfig1-dev \
            libfreetype-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF

      - name: Build
        run: cmake --build build --parallel $(nproc)

  build-macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          modules: 'qt5compat qtshadertools'
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.logicalcpu)

  build-windows:
    name: Windows (MSVC)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          arch: win64_msvc2022_64
          modules: 'qt5compat qtshadertools'
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Check outputs exist
        shell: pwsh
        run: |
          if (!(Test-Path build\cool-retro-term.exe)) { throw "exe missing" }
          if (!(Test-Path build\qmltermwidget\QMLTermWidget\qmltermwidget.dll)) { throw "plugin dll missing" }
