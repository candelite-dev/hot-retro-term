name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-appimage:
    name: Build (Linux, AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y build-essential rsync wget

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.0
          dir: ..
          modules: qt5compat qtshadertools
          setup-python: false
          cache: true

      - name: Build AppImage
        run: |
          ./scripts/build-appimage.sh

      - name: Collect artifact
        run: |
          mkdir -p release
          mv ./*.AppImage release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cool-retro-term-appimage
          path: ./release/*

  build-dmg:
    name: Build (macOS, DMG)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.*
          modules: qt5compat qtshadertools
          setup-python: true
          python-version: '3.11'
          cache: true

      - name: Build DMG
        run: |
          JOBS="$(sysctl -n hw.ncpu)"
          ./scripts/build-dmg.sh

      - name: Collect artifact
        run: |
          mkdir -p release
          mv ./*.dmg release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cool-retro-term-dmg
          path: ./release/*

  build-windows:
    name: Build (Windows, ZIP)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          arch: win64_msvc2022_64
          modules: 'qt5compat qtshadertools'
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy Qt runtime
        run: cmake --build build --target deploy_windows

      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: cool-retro-term-win64
          path: ./cool-retro-term-win64.zip

  release:
    name: Create Release
    runs-on: ubuntu-22.04
    needs:
      - build-appimage
      - build-dmg
      - build-windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: cool-retro-term-appimage
          path: ./release

      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: cool-retro-term-dmg
          path: ./release

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: cool-retro-term-win64
          path: ./release

      - name: Update rolling tag
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git tag -f rolling
          git push -f origin rolling

      - name: Publish rolling release
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: Rolling Release
          prerelease: true
          files: ./release/*

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ./release/*
